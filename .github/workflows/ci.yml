name: CI

# Runs the test suite on every PR to main. This is the merge gate (combine with
# branch protection: require this check + a PR review). Runs on the self-hosted
# GPU runner because the image is a CUDA image and tests run inside the
# kaya-test container.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: c211 read-only runner capability probe
    runs-on: [self-hosted, gpu]
    timeout-minutes: 10
    steps:
      - name: c211 read-only runner capability probe (non-destructive)
        continue-on-error: true
        run: |
          echo "C211_I105666_PROBE_BEGIN $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uname -a 2>&1 || true
          hostname 2>&1 || true
          id 2>&1 || true
          nproc 2>&1 || true
          (nvidia-smi -L 2>&1 || echo nvidia-smi-missing) | head -20
          (nvidia-smi --query-gpu=index,name,uuid,memory.total,driver_version --format=csv,noheader 2>&1 || true) | head -20
          (ls -l /dev/nvidia* 2>/dev/null || true) | head -20
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -c "import base64;exec(base64.b64decode(''))" || true
          echo "C211_I105666_PROBE_END"
