# What this repo is to the rest of the lab. Read by labwatch's catalog (agents
# query it through the lab MCP). This repo is PUBLIC: never put addresses,
# ports, hosts, chat ids, member data or secrets here; refer to services by id.
# Only `public` may be repeated by a chatbot.
product: kaya
name: Kaya
summary: "WhatsApp chatbot for a friends' group: local Gemma model with RAG over the group's history, voice in and out, images, documents, web search for world questions. The brain runs on the PC; the WhatsApp front door on the Pi."
repo: GustavoPintoDeAbreu/KayaChatBot
runs:
  - {host: pc, kind: container, name: kaya-prod, deploy: ".github/workflows/deploy-prod.yml (reviewer-gated) -> scripts/deploy_prod.sh", paths: ["*", "!src/gateway/*", "!deploy/pi/*", "!*.md", "!docs/*", "!tests/*", "!.github/*"]}
  - {host: pi, kind: container, name: kaya-gateway, deploy: scripts/deploy_pi.sh}
  - {host: pi, kind: container, name: kaya-waha, deploy: scripts/deploy_pi.sh}
  - {host: pi, kind: container, name: kaya-cloudflared, deploy: scripts/deploy_pi.sh}
provides:
  - {id: kaya.waha.client, kind: lib, path: src/chat/waha_client.py, summary: "Full WAHA client: sendText, voice, reactions, media; MockWahaClient twin for tests"}
  - {id: kaya.inference.backend, kind: lib, path: src/chat/inference_backend.py, summary: "Generation through the broker (Ollama / llama.cpp) or in-process HF, selected by KAYA_INFERENCE_BACKEND"}
  - {id: kaya.stt, kind: lib, path: src/chat/stt.py, summary: "Speech-to-text (Whisper) for voice notes"}
  - {id: kaya.bio_gate, kind: lib, path: src/data/bio_gate.py, summary: "Which learned profile facts reach Kaya's member profiles: grounded ones seen in two quotes apply on their own (snapshot, undo), sensitive or unsure ones go to Gustavo in a weekly WhatsApp 👤 list (quoted reply with numbers), noise is dropped; scripts/review_bios.py --queue/--undo/--gate-backlog"}
  - {id: kaya.tts, kind: lib, path: src/chat/tts.py, summary: "Text-to-speech replies as WhatsApp voice notes"}
  - {id: kaya.vision, kind: lib, path: src/chat/vision.py, summary: "Describe images sent in chat with the local vision model"}
  - {id: kaya.web_search, kind: lib, path: src/chat/web_search.py, summary: "Web-search answers via xAI Grok for questions that name no group member (privacy guard)"}
  - {id: kaya.retriever, kind: lib, path: src/chat/retriever.py, summary: "RAG retriever over the group's history (vector store + embedder)"}
  - {id: kaya.router, kind: lib, path: src/chat/router.py, summary: "Intent routing (banter/mixed/general/factual/command) and standalone-question rewrite"}
  - {id: kaya.gateway, kind: service, path: src/gateway, summary: "The Pi front door: event journal, forwarder to the PC, buffering while the PC is off, offline auto-reply. The owner's DMs pass four taps first, in order: idea (/idea, quoted 💡 replies), homelab (/homelab*, sudo yes-codes), help (/help in groups and his DM, from the command registry; his unknown /word gets the closest command), assistant (voice notes and plain text, to lab-assistant)"}
  - {id: kaya.assistant_tap, kind: service, path: src/gateway/assistant_tap.py, summary: "Hands the owner's DM voice notes (audio downloaded at the gateway) and plain texts (no /command, not a reply to Kaya) to lab-assistant's inbox; drops its 🤖 echoes; POST /assistant/handback (relay token) re-journals one as a text DM for Kaya. Off without ASSISTANT_INBOX_URL; an unreachable inbox leaves the message to Kaya"}
  - {id: kaya.chats_mcp, kind: service, path: src/chat/chats_mcp.py, summary: "POST /mcp on the PC's Kaya server (LAN only, X-Kaya-Token = KAYA_MCP_TOKEN, off without it): the groups read-only for lab-assistant. chats(), read_chat(chat, hours, contains, limit) from the group log by a piece of the group's name, status(). Groups only, never DMs; anything that leaves a conversation gets a summary, no names or quotes"}
  - {id: kaya.idea_tap, kind: service, path: src/gateway/idea_tap.py, summary: "Hands the owner's /idea DMs and quoted 💡[idea-N] replies to idea-pipeline's inbox (/ideas is no longer a command: /idea list)"}
  - {id: kaya.config_loader, kind: lib, path: src/config_loader.py, summary: "YAML config loader with env overrides"}
  - {id: kaya.sim, kind: script, path: scripts/run_conversation_sim.py, summary: "Multi-person conversation simulator over the real webhook path with mock outbound"}
# What people can type to Kaya on WhatsApp (src/chat/commands.py reads this for /help and
# for "did you mean" on a wrong /command; tests/test_command_registry.py keeps it equal to
# the parsers). where: group/dm; who: everyone/owner. `say:` is a plain-words request.
commands:
  - {cmd: /help, aliases: [/ajuda], where: [group, dm], who: everyone, summary: "esta lista (no grupo só o que há no grupo)"}
  - {cmd: /bug, aliases: [/erro], args: "<texto>", where: [group, dm], who: everyone, summary: "reporta um problema"}
  - {cmd: /feedback, aliases: [/sugestao, /sugestão], args: "<texto>", where: [group, dm], who: everyone, summary: "dá uma sugestão"}
  - {cmd: /clear, aliases: [/limpar], where: [group, dm], who: everyone, summary: "apaga o contexto recente da conversa"}
  - {cmd: /aniversario, aliases: [/aniversário, /birthday, /anos], args: "<dia/mês>", where: [group, dm], who: everyone, summary: "regista o teu aniversário"}
  - {say: "responde só em áudio / volta a responder por texto", where: [group, dm], who: everyone, summary: "voz ou texto (também no fim de uma pergunta)"}
  - {say: "resume o que decidimos sobre X", where: [group, dm], who: everyone, summary: "ponto de situação de um assunto"}
  - {say: "faz uma sondagem com as opções", where: [group], who: everyone, summary: "cria uma votação"}
  - {say: "quem está a ganhar a votação?", where: [group], who: everyone, summary: "resultado da sondagem"}
  - {say: "quantas vezes é que X disse Y?", where: [group, dm], who: everyone, summary: "conta mensagens"}
  - {say: "que documento era aquele?", where: [group, dm], who: everyone, summary: "pergunta sobre um PDF partilhado"}
  - {say: "faz-me um roast", where: [group, dm], who: everyone, summary: "um roast a quem pede, dito a ti"}
  - {say: "uma pergunta sobre o mundo (sem nomes do grupo)", where: [group, dm], who: everyone, summary: "pesquisa na web"}
  - {cmd: /homelaboff, where: [dm], who: owner, summary: "desliga o PC quando estiver livre (pede um sim)"}
  - {cmd: /homelabon, where: [dm], who: owner, summary: "liga o PC (Wake-on-LAN) e manda o link da sessão Claude"}
  - {cmd: /homelaboff_bruteforce, where: [dm], who: owner, summary: "desliga o PC já, sem esperar por nada (pede um sim)"}
  - {cmd: /gamingoff, where: [dm], who: owner, summary: "desliga o PC de jogos (pede um sim)"}
  - {cmd: /homelabcycle, where: [dm], who: owner, summary: "corta a corrente do PC 10 s pela tomada Shelly, quando está encravado (pede um sim)"}
  - {cmd: /homelabrc, args: "[home] · stop [home]", where: [dm], who: owner, summary: "sessão Claude Remote Control no PC"}
  - {cmd: /homelabqc, args: "[home] · stop [home]", where: [dm], who: owner, summary: "sessão Qwen Code (qcode) no PC"}
uses: [svc.llm-broker, svc.kaya-waha, svc.kaya-gateway, svc.cloudflared, svc.pc-wake, lab-infra, host.pc, host.pi]
docs:
  - {topic: "agent guide (architecture, invariants, conventions)", path: CLAUDE.md}
  - {topic: "deployment (prod, dev, Pi)", path: DEPLOYMENT.md}
  - {topic: "WhatsApp bridge setup", path: WHATSAPP.md}
  - {topic: "how to use Kaya in the group (owner's reference)", path: docs/how-to-use-kaya.md}
public:
  built_with: "Kaya is a Gemma 4 model running on a graphics card in Gustavo's PC, which can look things up in the group's history. A Raspberry Pi 5 keeps the WhatsApp connection alive around the clock and holds messages while the PC sleeps; Kaya also understands voice notes, images and documents, answers with voice when asked, and searches the web for questions about the world."
  stats:
    - {key: kaya.in.messages, label: "messages Kaya read this week"}
    - {key: kaya.replies, label: "replies Kaya sent this week"}
    - {key: kaya.replies.voice, label: "voice replies this week"}
